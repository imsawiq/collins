# Let Gradle discover JDKs installed by Adoptium, Microsoft, Oracle etc.
# in standard Windows / macOS / Linux locations. Combined with
# `gradle/gradle-daemon-jvm.properties` (toolchainVersion=21) this lets
# the daemon find a JDK 21 even when the user's $JAVA_HOME points at a
# newer version (e.g. JDK 25) that Gradle 8.14 / Loom 1.13 cannot run
# on yet.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
