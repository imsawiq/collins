# Let Gradle discover JDKs installed by Adoptium, Microsoft, Oracle etc.
# in standard Windows / macOS / Linux locations. Combined with
# `gradle/gradle-daemon-jvm.properties` (toolchainVersion=25) this lets
# the daemon find a JDK 25 even when the user's $JAVA_HOME points at a
# different version.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# Daemon heap — 26.1's Loom 1.15 jar build with nested bytedeco/ffmpeg
# natives comfortably exceeds the default 512 MB, so we bump to 4 GB.
# This must live in the ROOT gradle.properties; subproject copies are
# ignored by the Gradle daemon for JVM-arg purposes.
org.gradle.jvmargs=-Xmx4G
