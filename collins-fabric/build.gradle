plugins {
    // 26.1 introduced "Unobfuscated Loom" (no remapping). The plugin id is
    // intentionally different from the legacy fabric-loom: see
    // https://fabricmc.net/2026/03/14/261.html
    id "net.fabricmc.fabric-loom" version "1.15.5"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

base {
    archivesName = project.archives_base_name
}

dependencies {
    // No more `mappings` block — Loom 1.15+ for 26.1 ships unobfuscated Minecraft.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Native A/V stack — independent of Minecraft.
    implementation(include("org.bytedeco:javacv:1.5.12"))
    implementation(include("org.bytedeco:javacpp:1.5.12"))
    implementation(include("org.bytedeco:ffmpeg:7.1.1-1.5.12"))

    // Windows x64 native binaries with the JNI ffmpeg/javacpp layers (jniavutil etc.).
    implementation(include("org.bytedeco:javacpp:1.5.12:windows-x86_64"))
    implementation(include("org.bytedeco:ffmpeg:7.1.1-1.5.12:windows-x86_64-gpl"))

    // macOS Apple Silicon native binaries — required for FFmpegFrameGrabber
    // to load on M-series Macs (jniavutil/jniavformat etc. are platform-specific).
    implementation(include("org.bytedeco:javacpp:1.5.12:macosx-arm64"))
    implementation(include("org.bytedeco:ffmpeg:7.1.1-1.5.12:macosx-arm64-gpl"))

    // macOS Intel native binaries.
    implementation(include("org.bytedeco:javacpp:1.5.12:macosx-x86_64"))
    implementation(include("org.bytedeco:ffmpeg:7.1.1-1.5.12:macosx-x86_64-gpl"))

    // Linux x64 native binaries.
    implementation(include("org.bytedeco:javacpp:1.5.12:linux-x86_64"))
    implementation(include("org.bytedeco:ffmpeg:7.1.1-1.5.12:linux-x86_64-gpl"))

    implementation(include("maven.modrinth:cloth-config:${project.cloth_config_version}"))
    implementation("maven.modrinth:modmenu:${project.modmenu_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    // 26.1 requires Java 25 minimum, both at runtime and for the Gradle JVM.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// Unobfuscated Loom: the plain `jar` task is the shippable artifact, no remapJar.
tasks.named("jar", Jar) {
    from("LICENSE")
    archiveFileName = "${project.archives_base_name}-${project.version}-mc${project.minecraft_version}.jar"
}
