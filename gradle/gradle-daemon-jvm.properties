#
# Gradle Daemon JVM criteria.
#
# Gradle 8.14 + Fabric Loom 1.13 do not support running on a JDK newer
# than 21. Without this file, if the system default `java` is JDK 22+
# (for example Adoptium 25 installed by IntelliJ / Windows updaters),
# the daemon configuration phase fails with:
#
#   BUG! exception in phase 'semantic analysis' in source unit
#   '_BuildScript_' Unsupported class file major version <N>
#
# Pinning the daemon to JDK 21 here means contributors no longer have
# to remember to set JAVA_HOME before every build - Gradle will
# auto-discover any installed JDK 21 (Adoptium / Liberica / Microsoft
# Build of OpenJDK / SAPMachine / Oracle / etc.) via its standard
# detection paths.
#
toolchainVersion=21
