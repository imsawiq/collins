plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = "org.sawiq"
version = "1.4"

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.lumine.io/repository/maven-public/' } // ProtocolLib [web:159]
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT"
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// On the 26.1 branch we suffix the plugin jar with the targeted MC
// version so a release ZIP can pair collins-fabric-<v>-mc26.1.2.jar
// with collins-paper-<v>-mc26.1.2.jar without ambiguity.
tasks.named("jar") {
    archiveFileName = "${project.name}-${project.version}-mc26.1.2.jar"
}
