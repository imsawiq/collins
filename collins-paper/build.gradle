plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = "org.sawiq"
version = "1.3"

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.lumine.io/repository/maven-public/' } // ProtocolLib [web:159]
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT"
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// On the 1.21.11 branch we suffix the plugin jar with the targeted MC
// version so a release ZIP can pair collins-fabric-<v>-mc1.21.11.jar
// with collins-paper-<v>-mc1.21.11.jar without ambiguity. The plugin
// itself is server-API agnostic across 1.21.x, but bundling matched
// names per branch avoids users grabbing the wrong combo.
tasks.named("jar") {
    archiveFileName = "${project.name}-${project.version}-mc1.21.11.jar"
}
