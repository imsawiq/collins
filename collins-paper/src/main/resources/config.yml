language: en

video:
  # EN: Default max YouTube quality for newly created screens.
  #     Use 0 for auto, or one of: 360, 480, 720, 1080, 1440, 2160.
  # RU: Стандартное максимальное качество YouTube для новых экранов.
  #     Используй 0 для auto, либо одно из: 360, 480, 720, 1080, 1440, 2160.
  defaultYouTubeQuality: 720

  # EN: How often the server checks for ended videos and loop/playlist transitions.
  # RU: Как часто сервер проверяет окончание видео и переходы loop/playlist.
  endCheckIntervalTicks: 10

  # EN: How often the server re-broadcasts sync while something is playing.
  #     Lower values keep clients tighter in sync.
  # RU: Как часто сервер заново шлёт sync пока что-то воспроизводится.
  #     Меньше значение = меньше рассинхрон у клиентов.
  syncBroadcastIntervalTicks: 20

  # EN: Hard timeout for the server-side URL validation that runs
  #     before /collins play and /collins resume. We let yt-dlp /
  #     ffprobe try to resolve the URL for at most this many seconds
  #     before either trusting a cached positive answer (instant) or
  #     refusing the start. The effective timeout is never lower than
  #     ffprobe.timeout. Slow CDNs (cinemap.cc / paid streaming
  #     hosts) can take 10-20 s to first byte after a cold connect,
  #     so the default is intentionally generous. Clamped to [5, 120].
  # RU: Жёсткий таймаут серверной проверки URL перед /collins play и
  #     /collins resume. yt-dlp / ffprobe получают столько секунд на
  #     резолв; после — либо доверяем кэшу (мгновенно), либо
  #     отказываем. Итоговый таймаут никогда не ниже ffprobe.timeout.
  #     Медленные CDN (cinemap.cc / платные стриминговые хосты) могут
  #     отдавать первый байт через 10-20 секунд после холодного
  #     коннекта, поэтому дефолт сделан с запасом.
  #     Допустимый диапазон: [5, 120].
  preflightTimeoutSeconds: 30

# EN: Security settings for /collins admin commands and URLs.
# RU: Настройки безопасности для админ-команд /collins и URL.
security:

  # EN: Minimum time between any /collins commands from one player.
  #     Helps against spam/DoS. Set 0 to disable.
  # RU: Минимальная пауза между любыми командами /collins от одного игрока.
  #     Защита от спама/DoS. Поставь 0 чтобы отключить.
  commandRateLimitMs: 100

  # EN: Maximum URL length that can be saved with /collins seturl.
  #     Prevents huge strings from being stored.
  # RU: Максимальная длина URL, который можно сохранить через /collins seturl.
  #     Защита от слишком больших строк.
  maxUrlLength: 2048

  # EN: Maximum seek/back value in seconds (absolute value).
  #     Prevents overflow and extreme jumps.
  # RU: Максимальная перемотка seek/back в секундах (по модулю).
  #     Защита от overflow и слишком больших прыжков.
  maxSeekSeconds: 3600

  # EN: Allow URLs to local/private IPs.
  #     Keep this false for safety. Turn on only if you trust the URLs.
  # RU: Разрешать URL на локальные/приватные IP.
  #     Для безопасности держи false. Включай только если доверяешь URL.
  allowPrivateUrls: false

  # EN: Resolve DNS and block private/local addresses by resolved IP.
  #     If true, server may do DNS lookups when /collins seturl is executed.
  #     Default is false to avoid any lag on the main thread.
  # RU: Разрешать DNS-резолв и блокировать локальные/приватные адреса по IP.
  #     Если true, сервер может делать DNS-запросы при /collins seturl.
  #     По умолчанию false, чтобы не лагало на главном потоке.
  dnsResolve: false

# EN: FFprobe/yt-dlp settings for server-side video duration detection.
#     This is more secure than trusting client-reported duration.
# RU: Настройки FFprobe/yt-dlp для серверного определения длительности видео.
#     Это безопаснее чем доверять длительности от клиента.
ffprobe:
  # EN: Automatically download ffprobe and yt-dlp to plugins/collins-paper/tools/
  #     Set to false if you want to use system-installed tools.
  #     BUT IT'S STILL BETTER NOT TO CHANGE THIS PARAMETER TO FALSE, BECAUSE THE TIMELAPSE CALCULATIONS WILL BE COMPLETELY INACCURATE AND MAY HAVE VULNERABILITIES.
  # RU: Автоматически скачивать ffprobe и yt-dlp в plugins/collins-paper/tools/
  #     Поставь false если хочешь использовать системные инструменты.
  #     НО ВСЁ РАВНО ЛУЧШЕ НЕ МЕНЯЙТЕ ЭТОТ ПАРАМЕТР НА FALSE, ВЕДЬ ВЫЧИСЛЕНИЯ ТАЙМЛАПСА БУДУТ ФУЛЛ НЕТОЧНЫЕ И МОГУТ БЫТЬ УЯЗВИМОСТИ.
  auto_download: true
  
  # EN: Path to ffprobe binary. Empty or "auto" = use auto-downloaded.
  # RU: Путь к ffprobe. Пустое или "auto" = использовать автоскачанный.
  path: "auto"
  
  # EN: Path to yt-dlp binary. Empty or "auto" = use auto-downloaded.
  # RU: Путь к yt-dlp. Пустое или "auto" = использовать автоскачанный.
  ytdlp: "auto"
  
  # EN: Timeout in seconds for ffprobe/yt-dlp commands. Default: 30
  # RU: Таймаут в секундах для команд ffprobe/yt-dlp. По умолчанию: 30
  timeout: 30

# EN: Memory watchdog (DISABLED by default).
#     The primary defence against runaway memory is a hard-cap on the
#     plugin's own caches (FFprobe duration / failure caches; per-player
#     command rate-limit map). Those keep our footprint well under
#     1 MB regardless of server uptime, so for almost every server you
#     do NOT need this watchdog.
#
#     If you DO opt in by raising heapHighWatermark to a value in
#     [0.50, 0.98], the watchdog runs every checkIntervalMs and on
#     trip clears Collins' internal caches. It WILL NOT trip just
#     because some other plugin is eating heap: it also requires that
#     Collins itself owns at least minOwnedHeapBytes (default 10 MB).
#     Otherwise an unrelated plugin filling the heap would silently
#     dump our cached durations and trigger a yt-dlp re-probe storm
#     for no benefit.
#
#     Cost when enabled: one Runtime.getRuntime() read per pass while
#     below the watermark; cache scans only when over.
# RU: Сторож памяти (ПО УМОЛЧАНИЮ ВЫКЛЮЧЕН).
#     Основная защита от утечек — жёсткие лимиты на собственные кэши
#     плагина (FFprobe duration / failure кэши; rate-limit команд по
#     игрокам). Они держат наш футпринт меньше 1 МБ независимо от
#     аптайма, поэтому почти на любом сервере watchdog не нужен.
#
#     Если хочешь включить — поставь heapHighWatermark в диапазон
#     [0.50, 0.98]. Watchdog проверяет heap раз в checkIntervalMs и
#     при срабатывании сбрасывает свои кэши. Он НЕ сработает просто
#     потому что какой-то другой плагин ест heap: дополнительно
#     проверяется, что сам Collins занимает минимум minOwnedHeapBytes
#     (по умолчанию 10 МБ). Иначе мы бы зря дёргали свои кэши за
#     чужие грехи.
#
#     Стоимость когда включён: один вызов Runtime.getRuntime() на
#     проход, пока heap ниже порога; обход своих кэшей только когда
#     срабатывает.
memory:
  heapHighWatermark: 0.0
  minOwnedHeapBytes: 10485760
  checkIntervalMs: 10000
