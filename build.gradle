plugins {
    id 'base'
}

allprojects {
    repositories {
        mavenCentral()
    }
}

// Mirror the final shippable jars from each subproject into a single
// top-level build/libs/ folder so they can be grabbed without digging
// into collins-fabric/build/libs/ and collins-paper/build/libs/.
// Fabric: take the `jar` output. 26.1 / Loom 1.15+ ships unobfuscated
// Minecraft, so the plain `jar` is the production jar (no `remapJar`
// task exists anymore). Paper: the regular `jar` is the shippable
// artifact.
// Unmanaged copy: a plain task whose destination is NOT registered as a
// Gradle output. With a `Copy` / `Sync` task Gradle would treat
// build/libs/ as owned by the task and prune any file it did not just
// produce, which wiped the mc1.21.11 jars whenever the user switched
// to master and rebuilt (and vice versa). Doing the copy in doLast via
// project.copy keeps the directory un-tracked, so cross-branch jars
// accumulate naturally.
tasks.register('collectJars') {
    group = 'build'
    description = 'Copies the fabric and paper jars into <root>/build/libs'

    def fabricJar = project(':collins-fabric').tasks.named('jar')
    def paperJar = project(':collins-paper').tasks.named('jar')
    dependsOn fabricJar, paperJar

    doLast {
        copy {
            from fabricJar
            from paperJar
            into layout.buildDirectory.dir('libs')
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
    }
}

tasks.named('assemble') {
    dependsOn 'collectJars'
}

// Also kick off collectJars whenever the user invokes a subproject's
// jar-producing task directly (e.g. `gradlew :collins-fabric:build`).
// Without this, calling the subproject task bypasses the root
// `assemble` lifecycle entirely and the root build/libs/ stays empty.
project(':collins-fabric').afterEvaluate {
    project(':collins-fabric').tasks.named('jar') {
        finalizedBy ':collectJars'
    }
}
project(':collins-paper').afterEvaluate {
    project(':collins-paper').tasks.named('jar') {
        finalizedBy ':collectJars'
    }
}
